<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오메추 — 메뉴 추천 AI</title>
  <style>
    :root {
      --bg: #0c0c10;
      --surface: #16161e;
      --surface2: #1e1e28;
      --border: #272736;
      --accent: #8b7fff;
      --accent-glow: rgba(139,127,255,0.25);
      --accent2: #ff9f7a;
      --text: #e8e8f2;
      --muted: #7070a0;
      --green: #5fd4a0;
      --ai-bubble: #1a1a24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Apple SD Gothic Neo', -apple-system, 'Noto Sans KR', sans-serif;
      min-height: 100vh;
    }

    /* ─────────────────────────────────────────
       LOCK SCREEN
    ───────────────────────────────────────── */
    #lockScreen {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; z-index: 9999;
    }
    #lockScreen.hidden { display: none; }

    .lock-logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
      box-shadow: 0 0 40px var(--accent-glow);
      margin-bottom: 4px;
    }
    .lock-title { font-size: 22px; font-weight: 800; }
    .lock-sub   { font-size: 13px; color: var(--muted); margin-top: 4px; text-align: center; }

    #pinDisplay {
      display: flex; gap: 14px; margin: 4px 0;
    }
    .pin-dot {
      width: 13px; height: 13px; border-radius: 50%;
      border: 2px solid var(--border);
      transition: all 0.15s;
    }
    .pin-dot.filled {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }
    #pinError {
      color: #f76f6f; font-size: 13px; font-weight: 500;
      min-height: 18px; text-align: center;
    }
    .pin-grid {
      display: grid;
      grid-template-columns: repeat(3, 72px);
      gap: 10px;
    }
    .pin-key {
      height: 72px; border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text); font-size: 22px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      transition: background 0.12s, transform 0.08s;
    }
    .pin-key:hover  { background: var(--surface2); }
    .pin-key:active { transform: scale(0.94); background: var(--border); }
    .pin-key.action { font-size: 13px; font-weight: 500; color: var(--muted); }

    /* ─────────────────────────────────────────
       APP SHELL
    ───────────────────────────────────────── */
    #app {
      display: none;
      flex-direction: column;
      height: 100vh;
    }
    #app.visible { display: flex; }

    /* Header */
    header {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(22,22,30,0.95);
      backdrop-filter: blur(12px);
      flex-shrink: 0; z-index: 10;
    }
    .logo {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .header-text h1 { font-size: 16px; font-weight: 700; }
    .header-text p  { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .status-dot {
      width: 7px; height: 7px;
      background: var(--green); border-radius: 50%;
      margin-left: auto;
      box-shadow: 0 0 7px var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .clear-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--muted); padding: 5px 11px;
      border-radius: 7px; cursor: pointer;
      font-size: 12px; font-family: inherit;
      transition: all .2s;
    }
    .clear-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }

    /* ─────────────────────────────────────────
       STEP SCREENS (시간대 / 음식 종류)
    ───────────────────────────────────────── */
    .step-screen {
      flex: 1; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      padding: 32px 24px; gap: 28px; overflow-y: auto;
    }
    .step-screen.active { display: flex; }

    .step-eyebrow {
      font-size: 11px; font-weight: 600;
      letter-spacing: .12em; text-transform: uppercase;
      color: var(--muted);
    }
    .step-title {
      font-size: 26px; font-weight: 800;
      text-align: center; line-height: 1.25;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .step-sub { font-size: 14px; color: var(--muted); text-align: center; }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px; width: 100%; max-width: 360px;
    }
    .choice-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 24px 16px;
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
      cursor: pointer;
      transition: border-color .2s, background .2s, transform .15s;
      user-select: none;
    }
    .choice-card:hover {
      border-color: var(--accent);
      background: var(--surface2);
      transform: translateY(-2px);
    }
    .choice-card:active { transform: scale(0.97); }
    .choice-card .emoji { font-size: 32px; line-height: 1; }
    .choice-card .label {
      font-size: 15px; font-weight: 700; color: var(--text);
    }
    .choice-card .desc {
      font-size: 12px; color: var(--muted); text-align: center;
    }

    /* wide card (랜덤 등 3열 넘칠 때) */
    .choice-grid.four .choice-card:last-child:nth-child(odd) {
      grid-column: span 2;
    }

    /* Progress dots */
    .step-progress {
      display: flex; gap: 6px; align-items: center;
    }
    .prog-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--border); transition: all .3s;
    }
    .prog-dot.active {
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent-glow);
      width: 18px; border-radius: 3px;
    }

    /* ─────────────────────────────────────────
       CHAT SCREEN
    ───────────────────────────────────────── */
    #chatScreen {
      flex: 1; display: none;
      flex-direction: column; overflow: hidden;
    }
    #chatScreen.active { display: flex; }

    /* Context bar */
    #contextBar {
      display: flex; gap: 8px; padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap; align-items: center;
      background: var(--surface);
    }
    .ctx-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 20px;
      background: rgba(139,127,255,0.12);
      border: 1px solid rgba(139,127,255,0.25);
      color: var(--accent); font-size: 12px; font-weight: 600;
    }
    .ctx-change {
      margin-left: auto; font-size: 12px; color: var(--muted);
      cursor: pointer; padding: 4px 8px;
      border-radius: 6px; border: 1px solid var(--border);
      background: none; font-family: inherit;
      transition: all .2s;
    }
    .ctx-change:hover { color: var(--text); background: var(--surface2); }

    #messages {
      flex: 1; overflow-y: auto;
      padding: 20px 0; display: flex;
      flex-direction: column; gap: 6px;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .message-row {
      display: flex; padding: 4px 20px;
      animation: fadeIn .3s ease;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    .message-row.user { justify-content: flex-end; }
    .message-row.ai   { justify-content: flex-start; }

    .bubble {
      max-width: 75%; padding: 11px 15px;
      border-radius: 18px; font-size: 14px;
      line-height: 1.65; word-break: keep-all;
    }
    .user .bubble {
      background: linear-gradient(135deg,#3a3270,#2a2450);
      border: 1px solid rgba(139,127,255,.3);
      border-bottom-right-radius: 4px; color: #d8d4ff;
    }
    .ai .bubble {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    /* Restaurant card */
    .restaurant-card {
      margin-top: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden;
      transition: border-color .2s, transform .2s;
    }
    .restaurant-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card-header {
      display: flex; align-items: center; gap: 10px;
      padding: 13px 15px 9px;
    }
    .card-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; flex-shrink: 0;
    }
    .card-name  { font-size: 14px; font-weight: 700; }
    .card-menu  { font-size: 12px; color: var(--accent2); margin-top: 2px; }
    .card-reason { padding: 0 15px 9px; font-size: 12px; color: var(--muted); line-height: 1.5; }
    .card-link {
      display: block; margin: 0 11px 11px;
      padding: 7px 13px;
      background: rgba(139,127,255,.12);
      border: 1px solid rgba(139,127,255,.25);
      border-radius: 9px; color: var(--accent);
      text-decoration: none; font-size: 12px; font-weight: 600;
      text-align: center; transition: background .2s;
    }
    .card-link:hover { background: rgba(139,127,255,.22); }

    /* Typing */
    .typing { display:flex; gap:5px; padding:12px 15px; align-items:center; }
    .typing span {
      width:6px; height:6px; background:var(--muted);
      border-radius:50%; animation:bounce 1.2s infinite;
    }
    .typing span:nth-child(2){animation-delay:.2s}
    .typing span:nth-child(3){animation-delay:.4s}
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }

    /* Input */
    .input-area {
      padding: 12px 20px 18px;
      border-top: 1px solid var(--border);
      background: rgba(22,22,30,.95);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
    }
    .input-row {
      display: flex; gap: 9px; align-items: flex-end;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px; padding: 9px 9px 9px 14px;
      transition: border-color .2s;
    }
    .input-row:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    #input {
      flex:1; background:none; border:none; outline:none;
      color:var(--text); font-size:14px; font-family:inherit;
      resize:none; max-height:110px; line-height:1.5;
    }
    #input::placeholder { color:var(--muted); }
    #send-btn {
      width:36px; height:36px;
      background: linear-gradient(135deg, var(--accent), #6b5fff);
      border:none; border-radius:9px; color:#fff;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition: opacity .2s, transform .2s; flex-shrink:0;
    }
    #send-btn:hover { opacity:.85; transform:scale(1.05); }
    #send-btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }
    .input-hint { font-size:11px; color:var(--muted); margin-top:7px; text-align:center; }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════
     LOCK SCREEN
══════════════════════════════════════ -->
<div id="lockScreen">
  <div class="lock-logo">🍽️</div>
  <div style="text-align:center">
    <div class="lock-title">오메추</div>
    <div class="lock-sub">암호를 입력하세요</div>
  </div>
  <div id="pinDisplay"></div>
  <p id="pinError"></p>
  <div class="pin-grid">
    <button class="pin-key" data-k="1">1</button>
    <button class="pin-key" data-k="2">2</button>
    <button class="pin-key" data-k="3">3</button>
    <button class="pin-key" data-k="4">4</button>
    <button class="pin-key" data-k="5">5</button>
    <button class="pin-key" data-k="6">6</button>
    <button class="pin-key" data-k="7">7</button>
    <button class="pin-key" data-k="8">8</button>
    <button class="pin-key" data-k="9">9</button>
    <button class="pin-key action" data-k="clear">지우기</button>
    <button class="pin-key" data-k="0">0</button>
    <button class="pin-key action" data-k="del">⌫</button>
  </div>
</div>

<!-- ══════════════════════════════════════
     APP
══════════════════════════════════════ -->
<div id="app">

  <header>
    <div class="logo">🍽️</div>
    <div class="header-text">
      <h1>오메추</h1>
      <p>메뉴 추천(광진구 능동) AI</p>
    </div>
    <div class="status-dot"></div>
    <button class="clear-btn" onclick="resetToStep1()">처음부터</button>
  </header>

  <!-- ── Step 1: 시간대 ── -->
  <div class="step-screen active" id="step1">
    <div class="step-progress">
      <div class="prog-dot active" id="p1"></div>
      <div class="prog-dot" id="p2"></div>
      <div class="prog-dot" id="p3"></div>
    </div>
    <div style="text-align:center">
      <div class="step-eyebrow">Step 1</div>
      <div class="step-title">지금 몇 끼예요?</div>
      <div class="step-sub" style="margin-top:8px">식사 시간대를 선택해주세요</div>
    </div>
    <div class="choice-grid">
      <div class="choice-card" onclick="selectMealTime('아침')">
        <div class="emoji">🌅</div>
        <div class="label">아침</div>
        <div class="desc">개운하게 시작</div>
      </div>
      <div class="choice-card" onclick="selectMealTime('점심')">
        <div class="emoji">☀️</div>
        <div class="label">점심</div>
        <div class="desc">든든하게 충전</div>
      </div>
      <div class="choice-card" onclick="selectMealTime('저녁')">
        <div class="emoji">🌙</div>
        <div class="label">저녁</div>
        <div class="desc">하루 마무리</div>
      </div>
      <div class="choice-card" onclick="selectMealTime('야식')">
        <div class="emoji">🌃</div>
        <div class="label">야식</div>
        <div class="desc">늦은 밤 허기</div>
      </div>
    </div>
  </div>

  <!-- ── Step 2: 음식 종류 ── -->
  <div class="step-screen" id="step2">
    <div class="step-progress">
      <div class="prog-dot" id="p1b"></div>
      <div class="prog-dot active" id="p2b"></div>
      <div class="prog-dot" id="p3b"></div>
    </div>
    <div style="text-align:center">
      <div class="step-eyebrow">Step 2</div>
      <div class="step-title" id="step2Title">오늘 뭐가 당겨요?</div>
      <div class="step-sub" style="margin-top:8px">음식 종류를 골라주세요</div>
    </div>
    <div class="choice-grid four">
      <div class="choice-card" onclick="selectFoodType('한식')">
        <div class="emoji">🍚</div>
        <div class="label">한식</div>
        <div class="desc">찌개·밥·국수</div>
      </div>
      <div class="choice-card" onclick="selectFoodType('중식')">
        <div class="emoji">🥡</div>
        <div class="label">중식</div>
        <div class="desc">짜장·탕수육</div>
      </div>
      <div class="choice-card" onclick="selectFoodType('양식')">
        <div class="emoji">🍝</div>
        <div class="label">양식</div>
        <div class="desc">파스타·버거</div>
      </div>
      <div class="choice-card" onclick="selectFoodType('일식')">
        <div class="emoji">🍣</div>
        <div class="label">일식</div>
        <div class="desc">초밥·라멘</div>
      </div>
      <div class="choice-card" onclick="selectFoodType('분식')">
        <div class="emoji">🍦</div>
        <div class="label">분식</div>
        <div class="desc">떡볶이·김밥</div>
      </div>
      <div class="choice-card" onclick="selectFoodType('랜덤')">
        <div class="emoji">🎲</div>
        <div class="label">랜덤</div>
        <div class="desc">AI에게 맡기기</div>
      </div>
    </div>
  </div>

  <!-- ── Step 3: Chat ── -->
  <div id="chatScreen">
    <div id="contextBar">
      <div class="ctx-chip" id="ctxTime"></div>
      <div class="ctx-chip" id="ctxFood"></div>
      <button class="ctx-change" onclick="resetToStep1()">← 다시 선택</button>
    </div>
    <div id="messages"></div>
    <div class="input-area">
      <div class="input-row">
        <textarea id="input" rows="1" placeholder="메시지를 입력하세요..."
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button id="send-btn" onclick="sendMessage()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="input-hint">Enter로 전송 &nbsp;·&nbsp; Shift+Enter로 줄바꿈</div>
    </div>
  </div>

</div><!-- #app -->

<script>
  const CORRECT_PIN = '3189';
  const API = '/api/chat';

  let pin = '';
  let mealTime = '';
  let foodType = '';
  let conversationMessages = [];
  let isLoading = false;

  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('input');
  const sendBtn    = document.getElementById('send-btn');

  // ── PIN ───────────────────────────────────────────────────────────
  function renderPinDots() {
    const d = document.getElementById('pinDisplay');
    d.innerHTML = Array.from({length: 4}).map((_,i) =>
      `<div class="pin-dot ${i < pin.length ? 'filled' : ''}"></div>`
    ).join('');
  }
  renderPinDots();

  document.querySelectorAll('.pin-key').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.dataset.k;
      if (k === 'clear') { pin = ''; }
      else if (k === 'del') { pin = pin.slice(0, -1); }
      else if (pin.length < 4) { pin += k; }
      renderPinDots();
      document.getElementById('pinError').textContent = '';
      if (pin.length === 4) checkPin();
    });
  });

  function checkPin() {
    if (pin === CORRECT_PIN) {
      document.getElementById('lockScreen').classList.add('hidden');
      document.getElementById('app').classList.add('visible');
    } else {
      document.getElementById('pinError').textContent = '암호가 틀렸어요';
      pin = '';
      setTimeout(renderPinDots, 600);
    }
  }

  // ── Step 1 → 2 ────────────────────────────────────────────────────
  function selectMealTime(time) {
    mealTime = time;
    document.getElementById('step1').classList.remove('active');
    document.getElementById('step2').classList.add('active');
    document.getElementById('step2Title').textContent =
      `${time}엔 뭐가 당겨요?`;
  }

  // ── Step 2 → Chat ─────────────────────────────────────────────────
  function selectFoodType(type) {
    foodType = type;
    document.getElementById('step2').classList.remove('active');
    document.getElementById('chatScreen').classList.add('active');
    document.getElementById('ctxTime').textContent = '⏰ ' + mealTime;
    document.getElementById('ctxFood').textContent = '🍴 ' + foodType;

    // Load saved conversation
    const key = `nyamnyam_${mealTime}_${foodType}`;
    const saved = localStorage.getItem('nyamnyam_conv');
    if (saved) {
      try {
        conversationMessages = JSON.parse(saved);
        conversationMessages.forEach(m => {
          if (m.role === 'user') appendUserBubble(m.content);
          else if (m.role === 'assistant' && m.content) appendAIBubble(m.content);
        });
        if (conversationMessages.length) { scrollToBottom(); return; }
      } catch {}
    }

    // Fresh start
    const prompt = foodType === '랜덤'
      ? `안녕! 지금 ${mealTime}인데 뭐 먹을지 추천해줘.`
      : `안녕! 지금 ${mealTime}인데 ${foodType} 먹고 싶어. 추천해줘.`;
    sendToServer(prompt);
  }

  // ── Reset ─────────────────────────────────────────────────────────
  function resetToStep1() {
    mealTime = '';
    foodType = '';
    conversationMessages = [];
    messagesEl.innerHTML = '';
    localStorage.removeItem('nyamnyam_conv');
    document.getElementById('chatScreen').classList.remove('active');
    document.getElementById('step2').classList.remove('active');
    document.getElementById('step1').classList.add('active');
  }

  // ── Render ────────────────────────────────────────────────────────
  function appendUserBubble(text) {
    const row = document.createElement('div');
    row.className = 'message-row user';
    row.innerHTML = `<div class="bubble">${esc(text)}</div>`;
    messagesEl.appendChild(row);
  }

  function appendAIBubble(text) {
    const row = document.createElement('div');
    row.className = 'message-row ai';
    row.innerHTML = `<div class="bubble">${renderAI(text)}</div>`;
    messagesEl.appendChild(row);
  }

  function appendTyping() {
    const row = document.createElement('div');
    row.className = 'message-row ai'; row.id = 'typing-row';
    row.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    messagesEl.appendChild(row);
  }
  function removeTyping() { document.getElementById('typing-row')?.remove(); }

  // ── AI text parser ────────────────────────────────────────────────
  function renderAI(text) {
    const parts = [];
    const re = /\[RESTAURANT\]([\s\S]*?)\[\/RESTAURANT\]/g;
    let last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) parts.push({t:'text', c:text.slice(last, m.index)});
      parts.push({t:'card', c:m[1]});
      last = re.lastIndex;
    }
    if (last < text.length) parts.push({t:'text', c:text.slice(last)});
    return parts.map(p => p.t === 'card' ? renderCard(p.c) : fmtText(p.c.trim())).join('');
  }

  function renderCard(raw) {
    const get = k => { const m = raw.match(new RegExp(k+':\\s*(.+)')); return m ? m[1].trim() : ''; };
    const icons = ['🍜','🍖','🍣','🥘','🍱','🍛','🥗','🍔','🍲','🥩','🍕','🌮'];
    const icon  = icons[Math.floor(Math.random() * icons.length)];
    const link  = get('link');
    return `
      <div class="restaurant-card">
        <div class="card-header">
          <div class="card-icon">${icon}</div>
          <div>
            <div class="card-name">${esc(get('name'))}</div>
            <div class="card-menu">${esc(get('menu'))}</div>
          </div>
        </div>
        ${get('reason') ? `<div class="card-reason">${esc(get('reason'))}</div>` : ''}
        ${link ? `<a class="card-link" href="${link}" target="_blank" rel="noopener">📍 네이버 지도에서 보기</a>` : ''}
      </div>`;
  }

  function fmtText(t) {
    return t ? esc(t).replace(/\n/g,'<br>') : '';
  }
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Send ──────────────────────────────────────────────────────────
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isLoading) return;
    inputEl.value = ''; autoResize(inputEl);
    await sendToServer(text);
  }

  async function sendToServer(userText) {
    if (isLoading) return;
    isLoading = true; sendBtn.disabled = true;

    appendUserBubble(userText);
    conversationMessages.push({ role: 'user', content: userText });
    saveConv();
    appendTyping(); scrollToBottom();

    // 최근 3일 식사 기록 수집
    const recentMeals = loadRecentMeals();

    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ messages: conversationMessages, recentMeals })
      });
      if (!res.ok) throw new Error(`서버 오류 ${res.status}`);
      const data = await res.json();
      removeTyping();
      appendAIBubble(data.reply);
      conversationMessages = data.messages;
      saveConv();
      // 식사 확정 시 저장
      if (data.mealToSave) saveMeal(data.mealToSave);
    } catch (err) {
      removeTyping();
      appendAIBubble(`연결에 문제가 생겼어요 😢\n${err.message}`);
    } finally {
      isLoading = false; sendBtn.disabled = false;
      scrollToBottom(); inputEl.focus();
    }
  }

  // ── Meal localStorage ─────────────────────────────────────────────
  function loadRecentMeals() {
    try {
      const all = JSON.parse(localStorage.getItem('nyamnyam_meals') || '[]');
      const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 3);
      return all.filter(m => new Date(m.date) >= cutoff);
    } catch { return []; }
  }

  function saveMeal(meal) {
    try {
      const all = JSON.parse(localStorage.getItem('nyamnyam_meals') || '[]');
      all.push({ ...meal, savedAt: new Date().toISOString() });
      localStorage.setItem('nyamnyam_meals', JSON.stringify(all));
    } catch {}
  }

  function saveConv() {
    localStorage.setItem('nyamnyam_conv', JSON.stringify(conversationMessages));
  }

  // ── Helpers ───────────────────────────────────────────────────────
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 110) + 'px';
  }
  function scrollToBottom() {
    setTimeout(() => { messagesEl.scrollTop = messagesEl.scrollHeight; }, 50);
  }
</script>
</body>
</html>
