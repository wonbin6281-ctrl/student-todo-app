<script>
// ─── Constants ───────────────────────────────────────────────────────────────
const TODAY = new Date('2026-06-09T00:00:00');

const SUBJECT_COLORS = {
  '4차산업혁명':   '#FF4D4D',
  '데이터분석기초': '#10B981',
  '정치학입문':    '#4169E1',
  '딥러닝기초':   '#F97316',
  '미적분':       '#8A2BE2',
};
const COLOR_PALETTE = ['#06B6D4','#EC4899','#84CC16','#F59E0B','#6366F1','#EF4444','#14B8A6'];
let colorPaletteIdx = 0;

const DEFAULT_TASKS = [
  { id: 1, title: '4차산업혁명 과제 제출',        subject: '4차산업혁명',        type: '과제', dueDate: '2026-06-11', dueTime: '',    completed: false },
  { id: 2, title: '데이터분석기초 시험',           subject: '데이터분석기초',      type: '시험', dueDate: '2026-06-13', dueTime: '13:00', completed: false },
  { id: 3, title: '정치학입문 시험',               subject: '정치학입문',          type: '시험', dueDate: '2026-06-13', dueTime: '16:00', completed: false },
  { id: 4, title: '딥러닝기초 시험',               subject: '딥러닝기초',          type: '시험', dueDate: '2026-06-16', dueTime: '',    completed: false },
  { id: 5, title: '미적분 과제 제출',              subject: '미적분',              type: '과제', dueDate: '2026-06-17', dueTime: '',    completed: false },
  { id: 6, title: '학술적글쓰기 과제 제출',        subject: '학술적글쓰기',        type: '과제', dueDate: '2026-06-17', dueTime: '',    completed: false },
  { id: 7, title: '미적분 시험',                   subject: '미적분',              type: '시험', dueDate: '2026-06-18', dueTime: '',    completed: false },
  { id: 8, title: '품질공학 시험',                 subject: '품질공학',            type: '시험', dueDate: '2026-06-19', dueTime: '',    completed: false },
  { id: 9, title: '자료구조와 알고리즘 시험',      subject: '자료구조와 알고리즘', type: '시험', dueDate: '2026-06-20', dueTime: '',    completed: false },
];

// ─── Config ───────────────────────────────────────────────────────────────────
const OPENAI_API_KEY = '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';

// ─── Password Lock ────────────────────────────────────────────────────────────
const CORRECT_PIN = '3189';
let pinBuffer = '';

function initLock() {
  if (sessionStorage.getItem('unlocked') === '1') {
    document.getElementById('lockScreen').classList.add('hidden');
    return;
  }
  renderPinDisplay();
  document.querySelectorAll('.pin-key').forEach(btn => {
    btn.addEventListener('click', () => handlePinKey(btn.dataset.k));
  });
  // Keyboard support
  document.addEventListener('keydown', e => {
    if (document.getElementById('lockScreen').classList.contains('hidden')) return;
    if (/^[0-9ㄹ]$/.test(e.key)) handlePinKey(e.key);
    if (e.key === 'Backspace') handlePinKey('__del__');
  });
}

function handlePinKey(k) {
  if (k === '__del__') {
    pinBuffer = pinBuffer.slice(0, -1);
  } else {
    pinBuffer += k;
  }
  renderPinDisplay();
  document.getElementById('pinError').textContent = '';

  if (pinBuffer.length === CORRECT_PIN.length) {
    if (pinBuffer === CORRECT_PIN) {
      sessionStorage.setItem('unlocked', '1');
      document.getElementById('lockScreen').style.transition = 'opacity 0.3s';
      document.getElementById('lockScreen').style.opacity = '0';
      setTimeout(() => document.getElementById('lockScreen').classList.add('hidden'), 300);
    } else {
      document.getElementById('pinError').textContent = '암호가 올바르지 않습니다';
      document.querySelectorAll('.pin-dot').forEach(d => {
        d.style.background = '#A32D2D'; d.style.borderColor = '#A32D2D';
      });
      setTimeout(() => { pinBuffer = ''; renderPinDisplay(); document.getElementById('pinError').textContent = ''; }, 700);
    }
  }
}

function renderPinDisplay() {
  const container = document.getElementById('pinDisplay');
  container.innerHTML = Array.from({length: CORRECT_PIN.length}, (_, i) =>
    `<div class="pin-dot ${i < pinBuffer.length ? 'filled' : ''}"></div>`
  ).join('');
}

// ─── State ───────────────────────────────────────────────────────────────────
let tasks = [];
let activeTab = 'all';        // 'all' | 'incomplete' | 'complete'
let activeType = '과제';       // '과제' | '시험'
let activeSubject = '전체';    // '전체' | subject name

// Input form state
let inputSubject = '';
let inputDate = '';
let inputTime = '';
let inputType = '과제';

// ─── Storage ─────────────────────────────────────────────────────────────────
function loadTasks() {
  try {
    const saved = localStorage.getItem('tasks_v2');
    tasks = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_TASKS));
  } catch(e) {
    tasks = JSON.parse(JSON.stringify(DEFAULT_TASKS));
  }
}
function saveTasks() {
  localStorage.setItem('tasks_v2', JSON.stringify(tasks));
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function getSubjectColor(subject) {
  if (!SUBJECT_COLORS[subject]) {
    SUBJECT_COLORS[subject] = COLOR_PALETTE[colorPaletteIdx % COLOR_PALETTE.length];
    colorPaletteIdx++;
  }
  return SUBJECT_COLORS[subject];
}

function getDaysUntil(dueDateStr) {
  if (!dueDateStr) return null;
  const due = new Date(dueDateStr + 'T00:00:00');
  const diff = Math.floor((due - TODAY) / (1000 * 60 * 60 * 24));
  return diff;
}

function getStatusAccentColor(days) {
  if (days === null) return '#c7c6c6';
  if (days <= 0)  return '#A32D2D';
  if (days <= 2)  return '#A32D2D';
  if (days <= 3)  return '#BA7517';
  if (days <= 7)  return '#3B6D11';
  return '#c7c6c6';
}

function formatDueBadge(task) {
  const days = getDaysUntil(task.dueDate);
  if (days === null) return '';
  const timeStr = task.dueTime ? ` ${task.dueTime}` : '';
  if (days < 0) return { icon: 'priority_high', text: `D+${Math.abs(days)}`, color: 'status-red' };
  if (days === 0) return { icon: 'priority_high', text: 'D-Day', color: 'status-red' };
  if (days <= 2) return { icon: 'priority_high', text: `D-${days}${timeStr}`, color: 'status-red' };
  if (days <= 3) return { icon: 'schedule', text: `D-${days}${timeStr}`, color: 'status-orange' };
  const dueDate = new Date(task.dueDate + 'T00:00:00');
  const mo = dueDate.getMonth() + 1;
  const da = dueDate.getDate();
  return { icon: 'calendar_today', text: `${mo}/${da} (D-${days})`, color: 'secondary' };
}

function getAllSubjects() {
  const set = new Set(tasks.filter(t => t.type === activeType).map(t => t.subject).filter(Boolean));
  return ['전체', ...Array.from(set)];
}

function getFilteredTasks() {
  const filtered = tasks.filter(t => {
    if (activeTab === 'incomplete' && t.completed) return false;
    if (activeTab === 'complete' && !t.completed) return false;
    if (t.type !== activeType) return false;
    if (activeSubject !== '전체' && t.subject !== activeSubject) return false;
    return true;
  });
  // 미완료: 마감일 오름차순, 완료: 하단에
  const incomplete = filtered.filter(t => !t.completed).sort((a, b) => {
    if (!a.dueDate) return 1;
    if (!b.dueDate) return -1;
    return a.dueDate.localeCompare(b.dueDate);
  });
  const complete = filtered.filter(t => t.completed).sort((a, b) => {
    if (!a.dueDate) return 1;
    if (!b.dueDate) return -1;
    return a.dueDate.localeCompare(b.dueDate);
  });
  return [...incomplete, ...complete];
}

// ─── Render ───────────────────────────────────────────────────────────────────
function renderAll() {
  renderTodayLabel();
  renderSummaryCounts();
  renderSubjectFilters();
  renderTaskList();
}

function renderTodayLabel() {
  const days = ['일','월','화','수','목','금','토'];
  const d = TODAY;
  document.getElementById('todayLabel').textContent =
    `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;
}

function renderSummaryCounts() {
  const tabTasks = tasks.filter(t => t.type === activeType);
  const incomplete = tabTasks.filter(t => !t.completed);
  const urgent = incomplete.filter(t => {
    const days = getDaysUntil(t.dueDate);
    return days !== null && days >= 0 && days <= 3;
  });
  const done = tabTasks.filter(t => t.completed);
  document.getElementById('countTotal').textContent = tabTasks.length;
  document.getElementById('countUrgent').textContent = urgent.length;
  document.getElementById('countDone').textContent = done.length;
}

function renderSubjectFilters() {
  const subjects = getAllSubjects();
  const container = document.getElementById('subjectFilters');
  container.innerHTML = subjects.map(s => {
    const isActive = s === activeSubject;
    if (isActive) {
      return `<button class="subject-filter-btn flex-shrink-0 px-4 py-1.5 rounded-full bg-primary text-on-primary text-label-sm font-label-sm whitespace-nowrap" data-subject="${s}">${s}</button>`;
    }
    return `<button class="subject-filter-btn flex-shrink-0 px-4 py-1.5 rounded-full bg-background border border-border-subtle text-secondary text-label-sm font-label-sm hover:border-primary transition-colors whitespace-nowrap" data-subject="${s}">${s}</button>`;
  }).join('');
  container.querySelectorAll('.subject-filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeSubject = btn.dataset.subject;
      renderAll();
    });
  });
}

function renderTaskList() {
  const filtered = getFilteredTasks();
  const listEl = document.getElementById('taskList');
  const emptyEl = document.getElementById('emptyState');
  const titleEl = document.getElementById('sectionTitle');

  if (activeTab === 'complete') {
    titleEl.textContent = '완료된 할 일';
  } else if (activeTab === 'incomplete') {
    titleEl.textContent = '남은 할 일';
  } else {
    titleEl.textContent = '남은 할 일';
  }

  if (filtered.length === 0) {
    listEl.innerHTML = '';
    emptyEl.classList.remove('hidden');
    return;
  }
  emptyEl.classList.add('hidden');

  listEl.innerHTML = filtered.map(task => {
    const days = getDaysUntil(task.dueDate);
    const accentColor = task.completed ? '#c7c6c6' : getStatusAccentColor(days);
    const subjectColor = getSubjectColor(task.subject);
    const badge = formatDueBadge(task);
    const isExam = task.type === '시험';
    const checkInner = task.completed
      ? `<span class="material-symbols-outlined text-status-green text-[18px]">done</span>`
      : '';
    const cardOpacity = task.completed ? 'opacity-50' : '';
    const titleDecoration = task.completed ? 'line-through text-secondary' : 'text-primary';
    // 시험: 사각형, 과제: 원형
    const cbShape = isExam ? 'rounded' : 'rounded-full';

    const dueBadgeHtml = badge
      ? `<span class="flex items-center gap-1 text-label-sm text-${badge.color} font-bold">
           <span class="material-symbols-outlined text-[16px]">${badge.icon}</span>
           ${badge.text}
         </span>`
      : '';

    return `
    <div class="task-card relative bg-background border border-border-subtle rounded-xl p-4 flex items-center group overflow-hidden transition-all hover:border-primary ${cardOpacity}" data-id="${task.id}">
      <div class="absolute left-0 top-0 bottom-0 w-1" style="background:${accentColor}"></div>
      <div class="flex-shrink-0 mr-4">
        <div class="checkbox-btn w-6 h-6 ${cbShape} border-2 border-border-subtle hover:border-primary transition-colors cursor-pointer flex items-center justify-center" data-id="${task.id}">
          ${checkInner}
        </div>
      </div>
      <div class="flex-grow">
        <h4 class="text-subheader ${titleDecoration} mb-1">${task.title}</h4>
        <div class="flex gap-2 items-center flex-wrap">
          <span class="px-2 py-0.5 rounded text-white text-badge" style="background:${subjectColor}">${task.subject}</span>
          <span class="text-label-sm text-secondary">${task.type}</span>
          ${dueBadgeHtml}
        </div>
      </div>
      <button class="delete-btn opacity-0 text-secondary hover:text-status-red transition-all duration-200" data-id="${task.id}">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>`;
  }).join('');

  // Bind events
  listEl.querySelectorAll('.checkbox-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = parseInt(btn.dataset.id);
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        saveTasks();
        renderAll();
      }
    });
  });

  listEl.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = parseInt(btn.dataset.id);
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderAll();
    });
  });
}

// ─── Tabs ─────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-link').forEach(link => {
  link.addEventListener('click', () => {
    activeTab = link.dataset.tab;
    document.querySelectorAll('.tab-link').forEach(l => {
      l.classList.remove('text-primary', 'border-b-2', 'border-primary', 'font-bold');
      l.classList.add('text-secondary', 'font-medium');
    });
    link.classList.add('text-primary', 'border-b-2', 'border-primary', 'font-bold');
    link.classList.remove('text-secondary', 'font-medium');
    renderAll();
  });
});

// ─── Type Segmented Control ───────────────────────────────────────────────────
document.querySelectorAll('.type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeType = btn.dataset.type;
    document.querySelectorAll('.type-btn').forEach(b => {
      b.classList.remove('bg-background', 'shadow-sm', 'text-primary');
      b.classList.add('text-secondary');
    });
    btn.classList.add('bg-background', 'shadow-sm', 'text-primary');
    btn.classList.remove('text-secondary');
    renderAll();
  });
});

// ─── Input Form ───────────────────────────────────────────────────────────────
function toggleSubjectDropdown(e) {
  e.stopPropagation();
  const dropdown = document.getElementById('subjectDropdown');
  const isHidden = dropdown.classList.contains('hidden');
  closeAllDropdowns();
  if (isHidden) {
    renderSubjectDropdown();
    dropdown.classList.remove('hidden');
  }
}

function renderSubjectDropdown() {
  const subjects = Object.keys(SUBJECT_COLORS);
  // Add any subjects in tasks that aren't in the preset
  tasks.forEach(t => { if (t.subject && !subjects.includes(t.subject)) subjects.push(t.subject); });
  const dropdown = document.getElementById('subjectDropdown');
  dropdown.innerHTML = `
    <div class="px-3 py-1.5 text-eyebrow text-secondary uppercase tracking-wider">과목 선택</div>
    ${subjects.map(s => `
      <div class="subject-option px-4 py-2 text-body-default hover:bg-surface-container-low cursor-pointer flex items-center gap-2" data-subject="${s}">
        <span class="w-2 h-2 rounded-full" style="background:${getSubjectColor(s)}"></span>
        ${s}
      </div>
    `).join('')}
    <div class="border-t border-border-subtle mt-1 pt-1">
      <div class="px-3 py-1">
        <input id="newSubjectInput" type="text" placeholder="새 과목 입력..." class="w-full text-body-default bg-surface-container-low rounded px-2 py-1 border-none focus:ring-1 focus:ring-primary" />
      </div>
    </div>
  `;
  dropdown.querySelectorAll('.subject-option').forEach(opt => {
    opt.addEventListener('click', e => {
      e.stopPropagation();
      selectSubject(opt.dataset.subject);
    });
  });
  const newSubjectInput = dropdown.querySelector('#newSubjectInput');
  newSubjectInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const val = newSubjectInput.value.trim();
      if (val) selectSubject(val);
    }
    e.stopPropagation();
  });
  newSubjectInput.addEventListener('click', e => e.stopPropagation());
}

function selectSubject(subject) {
  inputSubject = subject;
  document.getElementById('subjectBtnLabel').textContent = subject;
  closeAllDropdowns();
}

function triggerDatePicker() {
  document.getElementById('dateInput').click();
}

function handleDateChange(val) {
  if (!val) return;
  const [datePart, timePart] = val.split('T');
  inputDate = datePart;
  inputTime = timePart || '';
  const [y, m, d] = datePart.split('-');
  const label = `${parseInt(m)}/${parseInt(d)}${timePart ? ' ' + timePart.substring(0, 5) : ''}`;
  document.getElementById('dateBtnLabel').textContent = label;
}

function toggleInputType() {
  inputType = inputType === '과제' ? '시험' : '과제';
  document.getElementById('inputTypeBtnLabel').textContent = inputType;
}

function addTask() {
  const input = document.getElementById('taskInput');
  const title = input.value.trim();
  if (!title) {
    input.focus();
    input.classList.add('ring-1', 'ring-red-400');
    setTimeout(() => input.classList.remove('ring-1', 'ring-red-400'), 1000);
    return;
  }
  const subject = inputSubject || '기타';
  if (!SUBJECT_COLORS[subject]) {
    SUBJECT_COLORS[subject] = COLOR_PALETTE[colorPaletteIdx % COLOR_PALETTE.length];
    colorPaletteIdx++;
  }
  const newId = tasks.length > 0 ? Math.max(...tasks.map(t => t.id)) + 1 : 1;
  tasks.push({
    id: newId,
    title,
    subject,
    type: inputType,
    dueDate: inputDate,
    dueTime: inputTime,
    completed: false,
  });
  saveTasks();
  // Reset form
  input.value = '';
  inputSubject = '';
  inputDate = '';
  inputTime = '';
  inputType = '과제';
  document.getElementById('subjectBtnLabel').textContent = '과목';
  document.getElementById('dateBtnLabel').textContent = '날짜';
  document.getElementById('inputTypeBtnLabel').textContent = '과제';
  document.getElementById('dateInput').value = '';
  // Switch to matching type tab so the new task is visible
  activeType = inputType === '과제' ? '과제' : '시험';
  document.querySelectorAll('.type-btn').forEach(b => {
    if (b.dataset.type === activeType) {
      b.classList.add('bg-background', 'shadow-sm', 'text-primary');
      b.classList.remove('text-secondary');
    } else {
      b.classList.remove('bg-background', 'shadow-sm', 'text-primary');
      b.classList.add('text-secondary');
    }
  });
  renderAll();
}

function closeAllDropdowns() {
  document.getElementById('subjectDropdown').classList.add('hidden');
}

// Close dropdowns on outside click
document.addEventListener('click', closeAllDropdowns);

// Enter key submits task
document.getElementById('taskInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTask();
});

// ─── AI Assistant ─────────────────────────────────────────────────────────────
// spin keyframe
const spinStyle = document.createElement('style');
spinStyle.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
document.head.appendChild(spinStyle);

function getTaskContext() {
  const today = TODAY.toISOString().split('T')[0];
  return tasks.map(t => {
    const days = getDaysUntil(t.dueDate);
    const dStr = t.dueDate ? `마감 ${t.dueDate}${t.dueTime ? ' ' + t.dueTime : ''} (${days !== null ? 'D-' + days : '날짜없음'})` : '마감일 없음';
    return `- [${t.type}] ${t.title} | 과목: ${t.subject} | ${dStr} | ${t.completed ? '✅완료' : '⬜미완료'}`;
  }).join('\n');
}

async function askAI(question) {
  const icon = document.getElementById('aiIcon');
  const sendIcon = document.getElementById('aiSendIcon');
  icon.textContent = 'autorenew';
  icon.style.animation = 'spin 1s linear infinite';
  sendIcon.style.color = '#000';

  const responseEl = document.getElementById('aiResponse');
  const textEl = document.getElementById('aiResponseText');
  responseEl.style.display = 'block';
  textEl.textContent = '';

  // 스트리밍 타이핑 효과
  let dotCount = 0;
  const loadingInterval = setInterval(() => {
    textEl.textContent = '생각하는 중' + '.'.repeat((dotCount++ % 3) + 1);
  }, 400);

  try {
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${OPENAI_API_KEY}`
      },
      body: JSON.stringify({
        model: 'gpt-4o-mini',
        temperature: 0.7,
        stream: false,
        messages: [
          {
            role: 'system',
            content: `당신은 학생의 할 일 관리를 도와주는 친근한 AI 어시스턴트입니다.
오늘 날짜: ${TODAY.toISOString().split('T')[0]} (${['일','월','화','수','목','금','토'][TODAY.getDay()]}요일)

현재 등록된 할 일 목록:
${getTaskContext()}

사용자의 질문에 위 정보를 바탕으로 친절하고 간결하게 답변하세요.
마감이 임박한 항목은 강조해주고, 우선순위 제안도 해주세요.
답변은 3~5문장 이내로 간결하게 작성하세요.`
          },
          { role: 'user', content: question }
        ]
      })
    });
    const data = await res.json();
    clearInterval(loadingInterval);
    const answer = data.choices?.[0]?.message?.content || '답변을 가져오지 못했습니다.';
    // 타이핑 효과
    textEl.textContent = '';
    let i = 0;
    const typing = setInterval(() => {
      textEl.textContent += answer[i++];
      if (i >= answer.length) clearInterval(typing);
    }, 18);
  } catch(e) {
    clearInterval(loadingInterval);
    textEl.textContent = '⚠️ 오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
  } finally {
    icon.textContent = 'auto_awesome';
    icon.style.animation = '';
    sendIcon.style.color = '#c7c6c6';
  }
}

function closeAiResponse() {
  document.getElementById('aiResponse').style.display = 'none';
  document.getElementById('searchInput').value = '';
}

document.getElementById('aiForm').addEventListener('submit', () => {
  const q = document.getElementById('searchInput').value.trim();
  if (q) askAI(q);
});
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const q = document.getElementById('searchInput').value.trim();
    if (q) askAI(q);
  }
});

// ─── Init ─────────────────────────────────────────────────────────────────────
initLock();
loadTasks();
renderAll();
</script>
